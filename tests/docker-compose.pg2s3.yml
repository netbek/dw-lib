  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address=:9001 &
      sleep 2;
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      case \"$(/usr/bin/mc ls local)\" in
        *pg2s3*) echo 'Bucket pg2s3 already exists';;
        *) /usr/bin/mc mb local/pg2s3;;
      esac;
      wait
      "
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - 28950:9000
      - 28951:9001
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/pg2s3"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 30s
    stop_grace_period: 0s
