services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.10.7-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - TZ=UTC
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 28030:8123
      - 28031:9000
    healthcheck:
      test: wget --no-verbose --spider http://0.0.0.0:8123/ping || exit 1
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 28010:5432
    volumes:
      - ./infra/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    command: postgres -c wal_level=logical -c max_wal_senders=2 -c max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

  catalog:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: catalog
    ports: !override
      - 28901:5432
    stop_grace_period: 0s

  temporal:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal
    ports: !override
      - 28910:7233
    stop_grace_period: 0s

  temporal-admin-tools:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-admin-tools
    stop_grace_period: 0s
    healthcheck:
      # Added check for MirrorName attribute to ensure that temporal-admin-tools service is ready
      # https://github.com/PeerDB-io/peerdb/blob/248fbe54d6b56b57d7908bdcc8cd0893d7f270f2/scripts/mirror-name-search.sh
      test: ["CMD-SHELL", "temporal workflow list && temporal operator search-attribute list | grep -w MirrorName"]
      interval: 1s
      timeout: 5s
      retries: 30

  temporal-ui:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-ui
    ports: !override
      - 28930:8080
    stop_grace_period: 0s

  flow-api:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: flow-api
    ports: !override
      - 28940:8112
      - 28941:8113
    stop_grace_period: 0s

  flow-snapshot-worker:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: flow-snapshot-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 0s

  flow-worker:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: flow-worker
    stop_grace_period: 0s

  peerdb:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb
    ports: !override
      - 28900:9900
    stop_grace_period: 0s

  peerdb-ui:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-ui
    ports: !override
      - 28920:3000
    stop_grace_period: 0s

  minio:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: minio
    ports: !override
      - 28950:9000
      - 28951:36987
    stop_grace_period: 0s

volumes:
  pgdata:
  minio-data:

networks:
  default:
    name: dw-lib-example
    driver: bridge
