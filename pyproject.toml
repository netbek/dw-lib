[project]
name = "netbek-dw-lib"
version = "1.32.10"
description = "Tools for working with Postgres, ClickHouse, and DuckDB."
readme = "README.md"
requires-python = "==3.13.*"

# sqlglot pinned for compatibility with dagster-dbt https://github.com/dagster-io/dagster/blob/1.12.19/python_modules/libraries/dagster-dbt/pyproject.toml#L33
dependencies = [
    "jinja2>=3.1.6",
    "lazy-loader>=0.5",
    "packaging>=26.0",
    "psutil>=7.1.3",
    "pydantic>=2.12.4",
    "pydash>=8.0.5",
    "requests>=2.32.5",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.44",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
    "sqlparse>=0.5.3",
]

[project.optional-dependencies]
clickhouse = [
    "clickhouse-connect>=0.10.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
]

duckdb = [
    "duckdb>=1.4.2",
    "duckdb-engine>=0.17.0",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
]

psycopg = [
    "psycopg[binary]>=3.3.3",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
]

psycopg2 = [
    "psycopg2-binary>=2.9.11",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
]

dagster = [
    "dagster>=1.12.19",
    "dagster-dbt>=0.28.19",
]

dbt = [
    "clickhouse-connect>=0.10.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "dbt-clickhouse>=1.10.0",
    "livereload>=2.7.1",
    "opentelemetry-sdk>=1.39.1",
    "polyfactory>=3.0.0",
    "pydantic>=2.12.4",
    "pydash>=8.0.5",
    "ruamel-yaml>=0.19.1",
    "sqlglot>=28.0.0,<28.1.0",
    "sqlmodel>=0.0.27",
]

loader = [
    "boto3>=1.41.1",
    "chdb>=3.7.2",
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "rich>=14.2.0",
]

peerdb = [
    "clickhouse-connect>=0.10.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "pydantic>=2.12.4",
    "pydash>=8.0.5",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.44",
    "sqlglot>=28.0.0",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = [
    "docker>=7.1.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-docker>=3.2.5",
    "ruff>=0.15.0",
    "twine>=6.2.0",
    "ty>=0.0.23",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.12.0"]
build-backend = "uv_build"

[tool.isort]
force_alphabetical_sort = true
line_length = 100
profile = "black"
py_version = 313

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["./vendor"]

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D205"]

# [tool.pyright]
# include = ["src", "tests"]
# pythonVersion = "3.13"
# typeCheckingMode = "basic"
# reportPrivateImportUsage = "none"

[tool.ty.rules]
invalid-method-override = "ignore" # https://github.com/astral-sh/ty/issues/2154

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest]
addopts = ["-x", "--no-header", "--container-scope=module"]
filterwarnings = [
    "ignore:The 'u' type code is deprecated:DeprecationWarning", # Caused by clickhouse_connect
    "ignore::DeprecationWarning:dbt_common.invocation", # https://github.com/dbt-labs/dbt-core/issues/9791
    "ignore::DeprecationWarning:dbt.cli.options"        # https://github.com/dbt-labs/dbt-core/issues/12038
]
markers = ["docker_compose_file", "docker_skip_wait_until_responsive"]

[tool.uv.build-backend]
module-name = "dw_lib"
