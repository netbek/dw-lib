peers:
  postgres:
    type: postgres
    host: postgres
    port: 5432
    username: postgres
    password: postgres
    database: test

  duckdb:
    type: duckdb
    database: /app/temp/test.duckdb
    extensions:
      - postgres

mirrors:
  postgres_to_duckdb:
    peers:
      source: postgres
      destination: duckdb
    tables:
    - source: postgres.public.items
      destination: test.main.items

  duckdb_to_postgres:
    peers:
      source: duckdb
      destination: postgres
    tables:
    - source: test.main.items
      destination: postgres.duckdb.items
