peerdb_ui_url: http://localhost:3000

# Reference: https://github.com/PeerDB-io/peerdb/blob/v0.36.6/flow/internal/dynamicconf.go#L26
settings:
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: "peerdb"
  PEERDB_CLICKHOUSE_BINARY_FORMAT: "raw"
  PEERDB_CLICKHOUSE_CLIENT_NAME: "peerdb"
  PEERDB_CLICKHOUSE_ENABLE_JSON: "false"
  PEERDB_CLICKHOUSE_ENABLE_PRIMARY_UPDATE: "false"
  PEERDB_CLICKHOUSE_INITIAL_LOAD_ALLOW_NON_EMPTY_TABLES: "false"
  PEERDB_CLICKHOUSE_INITIAL_LOAD_PARTS_PER_PARTITION: "1"
  PEERDB_CLICKHOUSE_MAX_INSERT_THREADS: "0"
  PEERDB_CLICKHOUSE_PARALLEL_NORMALIZE: "0"
  PEERDB_CLICKHOUSE_UNBOUNDED_NUMERIC_AS_STRING: "false"
  PEERDB_NULLABLE: "true"
  PEERDB_POSTGRES_ENABLE_FAILOVER_SLOTS: "false"

peers:
  source:
    type: postgres
    settings:
      host: postgres
      port: 5432
      username: postgres
      password: postgres
      database: example

    # Optional. The Python wrapper connects to the source database for some tasks, e.g.
    # to check whether the source tables exist. This connection is created outside of the
    # PeerDB API container, so the host and port could differ from the `settings` values.
    adapter_settings:
      host: localhost
      port: 25432
      username: postgres
      password: postgres
      database: example

  destination:
    type: clickhouse
    settings:
      host: clickhouse
      port: 9000
      username: default
      password: default
      database: example

    # Optional. The Python wrapper connects to the destination database for some tasks, e.g.
    # to check whether the destination tables exist. This connection is created outside of the
    # PeerDB API container, so the host and port could differ from the `settings` values.
    adapter_settings:
      host: localhost
      port: 28123
      username: default
      password: default
      database: example

mirrors:
  +do_initial_snapshot: true

  cdc_one:
    source_name: source
    destination_name: destination
    table_mappings:
      - source_table_identifier: public.table_1
        destination_table_identifier: table_1

  cdc_many:
    source_name: source
    destination_name: destination
    table_mappings:
      - source_table_identifier: public.table_2
        destination_table_identifier: table_2
      - source_table_identifier: public.table_3
        destination_table_identifier: table_3
