name: dw-lib

services:
  postgres:
    image: postgres:17.4-alpine3.21
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 15432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    deploy:
      restart_policy:
        condition: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.2.39-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - TZ=UTC
    ports:
      - 18123:8123
    healthcheck:
      test: wget --no-verbose --spider http://0.0.0.0:8123/ping || exit 1
      interval: 1s
      timeout: 1s
      retries: 10
    deploy:
      restart_policy:
        condition: on-failure

  catalog:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: catalog

  temporal:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: temporal

  temporal-admin-tools:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: temporal-admin-tools

  temporal-ui:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: temporal-ui

  flow-api:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: flow-api

  flow-snapshot-worker:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: flow-snapshot-worker
    extra_hosts:
      - host.docker.internal:host-gateway

  flow-worker:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: flow-worker

  peerdb:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: peerdb

  peerdb-ui:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: peerdb-ui

  minio:
    extends:
      file: ./vendor/peerdb/docker-compose.yml
      service: minio

  app:
    image: dw-lib-app:latest
    build: .
    environment:
      - TZ=UTC
    working_dir: /app
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./vendor/wait-for-it/wait-for-it.sh:/wait-for-it.sh:ro
    depends_on:
      - postgres
      - clickhouse
      - catalog
      - temporal
      - temporal-admin-tools
      - temporal-ui
      - flow-api
      - flow-snapshot-worker
      - flow-worker
      - peerdb
      - peerdb-ui
      - minio
    stop_grace_period: 0s
    command: /wait-for-it.sh postgres:5432 -- /wait-for-it.sh clickhouse:8123 -- /wait-for-it.sh peerdb-ui:3000 -- /wait-for-it.sh peerdb-ui:3000 -- /bin/bash
    stdin_open: true
    tty: true

volumes:
  pgdata:
  minio-data:

networks:
  default:
    name: dw-lib
