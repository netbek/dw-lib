peerdb_ui_url: http://localhost:3000

settings:
  PEERDB_NULLABLE: "true"

peers:
  source:
    type: postgres
    settings:
      host: host.docker.internal
      port: 25432
      username: postgres
      password: postgres
      database: test
    adapter_settings:
      host: localhost
      port: 25432
      username: postgres
      password: postgres
      database: test

  destination:
    type: clickhouse
    settings:
      host: host.docker.internal
      http_port: 28123
      tcp_port: 29000
      username: default
      password: default
      database: default
    adapter_settings:
      host: localhost
      http_port: 28123
      tcp_port: 29000
      username: default
      password: default
      database: default

mirrors:
  +do_initial_snapshot: false
  +resync: false

  cdc_one:
    source_name: source
    destination_name: destination
    table_mappings:
      - source_table_identifier: public.table_1
        destination_table_identifier: table_1
    resync: true

  cdc_many:
    source_name: source
    destination_name: destination
    table_mappings:
      - source_table_identifier: public.table_2
        destination_table_identifier: table_2
      - source_table_identifier: public.table_3
        destination_table_identifier: table_3
