# Source:
# https://github.com/temporalio/samples-server/blob/21ba633df78cd0f4a02096d620c19eb2d17ef900/compose/docker-compose.yml
# https://github.com/PeerDB-io/peerdb/blob/v0.36.9/docker-compose.yml

name: peerdb-quickstart

x-minio-env: &minio-env
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: admin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: password
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://host.docker.internal:9001
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdb

x-catalog-env: &catalog-env
  PEERDB_CATALOG_HOST: catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-peerdb-flow-worker-env: &peerdb-flow-worker-env
  TEMPORAL_HOST_PORT: temporal-server:7233
  TEMPORAL_CLIENT_CERT:
  TEMPORAL_CLIENT_KEY:
  PEERDB_TEMPORAL_NAMESPACE: default
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}

services:
  catalog:
    image: ${POSTGRES_IMAGE}
    command: -c config_file=/etc/postgresql.conf
    restart: unless-stopped
    ports:
      - 9901:5432
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./catalog/postgresql.conf:/etc/postgresql.conf
      - ./catalog/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  temporal-setup-postgres:
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: catalog # Postgres service name
      SKIP_DB_CREATE: true
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    entrypoint: ["/bin/sh", "-c", "/scripts/setup-postgres.sh"]
    volumes:
      - ./temporal/scripts:/scripts

  temporal-server:
    restart: unless-stopped
    depends_on:
      temporal-setup-postgres:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: catalog
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    image: ${TEMPORAL_SERVER_IMAGE}
    ports:
      - 7233:7233
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
      DEFAULT_NAMESPACE: default
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    entrypoint: ["/bin/sh", "-c", "/scripts/create-namespace.sh"]
    volumes:
      - ./temporal/scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "temporal workflow list && temporal operator search-attribute list | grep -w MirrorName"]
      interval: 1s
      timeout: 5s
      retries: 30

  temporal-ui:
    restart: unless-stopped
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
      TEMPORAL_CSRF_COOKIE_INSECURE: true
    image: ${TEMPORAL_UI_IMAGE}
    ports:
      - 8085:8080

  peerdb-flow-api:
    image: ${PEERDB_FLOW_API_IMAGE}
    restart: unless-stopped
    ports:
      - 8112:8112
      - 8113:8113
    environment:
      <<: [*catalog-env, *peerdb-flow-worker-env, *minio-env]
      PEERDB_ALLOWED_TARGETS:
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  peerdb-flow-snapshot-worker:
    image: ${PEERDB_FLOW_SNAPSHOT_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      <<: [*catalog-env, *peerdb-flow-worker-env, *minio-env]
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  peerdb-flow-worker:
    image: ${PEERDB_FLOW_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      <<: [*catalog-env, *peerdb-flow-worker-env, *minio-env]
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully

  peerdb-server:
    stop_signal: SIGINT
    image: ${PEERDB_SERVER_IMAGE}
    restart: unless-stopped
    environment:
      <<: *catalog-env
      PEERDB_PASSWORD:
      PEERDB_FLOW_SERVER_ADDRESS: grpc://peerdb-flow-api:8112
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - 9900:9900
    depends_on:
      catalog:
        condition: service_healthy

  peerdb-ui:
    image: ${PEERDB_UI_IMAGE}
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      <<: *catalog-env
      PEERDB_FLOW_SERVER_HTTP: http://peerdb-flow-api:8113
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:3000
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: true
    depends_on:
      - peerdb-flow-api

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    volumes:
      - minio-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      <<: *minio-env
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    entrypoint: |
      /bin/sh -c "
      minio server /data --console-address=:9001 & sleep 2;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME;
      mc ilm rule add "local/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME" --expire-days 7 --noncurrent-expire-days 7
      wait
      "

volumes:
  catalog-data:
  minio-data:
