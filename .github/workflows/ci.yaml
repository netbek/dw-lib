name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linter
        run: |
          . .venv/bin/activate
          ruff check --config pyproject.toml

      - name: Run tests
        run: uv run --frozen pytest

      - name: Debug PeerDB Catalog Logs
        if: failure()
        run: |
          docker logs dw-lib-test-peerdb-catalog-1
          docker inspect dw-lib-test-peerdb-catalog-1 --format='{{json .State.Health}}'
