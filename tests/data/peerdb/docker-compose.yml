# Source:
# https://github.com/temporalio/samples-server/blob/21ba633df78cd0f4a02096d620c19eb2d17ef900/compose/docker-compose.yml
# https://github.com/PeerDB-io/peerdb/blob/v0.36.9/docker-compose.yml

name: peerdb-quickstart

x-minio-config: &minio-config
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: _peerdb_minioadmin
  MINIO_ROOT_USER: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: _peerdb_minioadmin
  MINIO_ROOT_PASSWORD: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://host.docker.internal:9001
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket

x-catalog-config: &catalog-config
  PEERDB_CATALOG_HOST: catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-peerdb-flow-worker-env: &peerdb-flow-worker-env
  TEMPORAL_HOST_PORT: temporal-server:7233
  TEMPORAL_CLIENT_CERT:
  TEMPORAL_CLIENT_KEY:
  PEERDB_TEMPORAL_NAMESPACE: default
  # For GCS, these will be your HMAC keys instead
  # For more information:
  # https://cloud.google.com/storage/docs/authentication/managing-hmackeys
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # For GCS, set this to "auto" without the quotes
  AWS_REGION: ${AWS_REGION:-}
  # For GCS, set this as: https://storage.googleapis.com
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}

services:
  catalog:
    container_name: catalog
    image: ${POSTGRES_IMAGE}
    command: -c config_file=/etc/postgresql.conf
    restart: unless-stopped
    ports:
      - 9901:5432
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql.conf
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  postgres-setup:
    container_name: postgres-setup
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=catalog # Postgres service name
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    entrypoint: ["/bin/sh", "-c", "/scripts/postgres-setup.sh"]
    volumes:
      - ./postgres-setup:/scripts

  temporal-server:
    container_name: temporal-server
    restart: unless-stopped
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=catalog
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    image: ${TEMPORAL_SERVER_IMAGE}
    ports:
      - 7233:7233
    volumes:
      - ./temporal-server/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-setup:
    container_name: temporal-setup
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - DEFAULT_NAMESPACE=default
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE}
    entrypoint: ["/bin/sh", "-c", "/scripts/temporal-setup.sh"]
    volumes:
      - ./temporal-setup:/scripts
    healthcheck:
      test: ["CMD-SHELL", "temporal workflow list && temporal operator search-attribute list | grep -w MirrorName"]
      interval: 1s
      timeout: 5s
      retries: 30

  temporal-ui:
    container_name: temporal-ui
    restart: unless-stopped
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    image: ${TEMPORAL_UI_IMAGE}
    ports:
      - 8085:8080

  peerdb-flow-api:
    container_name: peerdb-flow-api
    image: ${PEERDB_FLOW_API_IMAGE}
    restart: unless-stopped
    ports:
      - 8112:8112
      - 8113:8113
    environment:
      <<: [*catalog-config, *peerdb-flow-worker-env, *minio-config]
      PEERDB_ALLOWED_TARGETS:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      temporal-setup:
        condition: service_completed_successfully

  peerdb-flow-snapshot-worker:
    container_name: peerdb-flow-snapshot-worker
    image: ${PEERDB_FLOW_SNAPSHOT_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *peerdb-flow-worker-env, *minio-config]
    depends_on:
      temporal-setup:
        condition: service_completed_successfully

  peerdb-flow-worker:
    container_name: peerdb-flow-worker
    image: ${PEERDB_FLOW_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *peerdb-flow-worker-env, *minio-config]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      temporal-setup:
        condition: service_completed_successfully

  peerdb-server:
    container_name: peerdb-server
    stop_signal: SIGINT
    image: ${PEERDB_SERVER_IMAGE}
    restart: unless-stopped
    environment:
      <<: *catalog-config
      PEERDB_PASSWORD:
      PEERDB_FLOW_SERVER_ADDRESS: grpc://peerdb-flow-api:8112
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - 9900:9900
    depends_on:
      catalog:
        condition: service_healthy

  peerdb-ui:
    container_name: peerdb-ui
    image: ${PEERDB_UI_IMAGE}
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      <<: *catalog-config
      PEERDB_FLOW_SERVER_HTTP: http://peerdb-flow-api:8113
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:3000
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: true
    depends_on:
      - peerdb-flow-api

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    volumes:
      - minio-data:/data
    ports:
      - "9001:9000"
      - "9002:36987"
    environment:
      <<: *minio-config
    entrypoint: |
      /bin/sh -c "
      minio server /data --console-address=:36987 & sleep 2;
      mc alias set myminiopeerdb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminiopeerdb/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME;
      mc ilm rule add "myminiopeerdb/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME" --expire-days 7 --noncurrent-expire-days 7
      wait
      "

volumes:
  postgres-data:
  minio-data:

networks:
  default:
    name: peerdb_network
