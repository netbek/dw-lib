[project]
name = "cli"
version = "0.1.0"
description = "CLI example"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "dbt-clickhouse",
    "dbt-core>=1.10.0,<1.12", # Pinned because of dbt-clickhouse
    "example-cli",
    "livereload>=2.7.1",
]

[tool.uv.sources]
dbt-clickhouse = { git = "https://github.com/netbek/dbt-clickhouse.git", rev = "v1.10.0-batch" }
example-cli = { path = "./packages/example_cli", editable = true }
