[project]
name = "dw-lib"
version = "1.0.0"
description = "Tools for working with Postgres and ClickHouse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.8.15",
    "clickhouse-sqlalchemy",
    "dbt-artifacts-parser==0.8.1",
    "dbt-clickhouse",
    "dbt-core==1.8.9", # Pinned because of dbt-clickhouse
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "polyfactory>=2.20.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.8.1",
    "pydash>=8.0.5",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "sqlalchemy>=2.0.38",
    "sqlglot>=26.12.1",
    "sqlmodel>=0.0.24",
    "sqlparse>=0.5.3",
    "typer>=0.19.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-docker>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
force_alphabetical_sort = true
line_length = 100
profile = "black"
py_version = 313

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D205"]

[tool.pytest.ini_options]
addopts = "--no-header -vv"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning:dbt_common.invocation" # https://github.com/dbt-labs/dbt-core/issues/9791

[tool.uv.sources]
clickhouse-sqlalchemy = { git = "https://github.com/netbek/clickhouse-sqlalchemy.git", rev = "datetime-uuid" }
dbt-clickhouse = { git = "https://github.com/netbek/dbt-clickhouse.git", rev = "v1.8.9-batch" }
