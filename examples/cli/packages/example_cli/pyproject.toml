[project]
name = "example-cli"
version = "0.1.0"
description = "Example CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dw-lib",
    "livereload>=2.7.1",
    "rich>=14.2.0",
    "typer>=0.19.2",
]

[project.scripts]
cli = "example_cli:app"
# dbt = "example_cli.dbt_cli:dbt_app"
# peerdb = "example_cli.peerdb_cli:peerdb_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/example_cli"]

[tool.isort]
force_alphabetical_sort = true
line_length = 100
profile = "black"
py_version = 313

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D205"]

[tool.uv.sources]
dw-lib = { path = "../../../../", editable = true }
