services:
  postgres-primary:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 25432:5432
    command: postgres -c wal_level=logical -c max_wal_senders=2 -c max_replication_slots=4 -c max_wal_size=64MB -c min_wal_size=32MB -c max_slot_wal_keep_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

  postgres-replica:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 25433:5432
    command: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s
    depends_on:
      - postgres-primary

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.21.7-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - TZ=UTC
    ports:
      - 28123:8123
      - 29000:9000
    healthcheck:
      test: wget --no-verbose --spider http://0.0.0.0:8123/ping || exit 1
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

  catalog:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: catalog
    stop_grace_period: 0s

  temporal:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: temporal
    stop_grace_period: 0s

  temporal-admin-tools:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: temporal-admin-tools
    stop_grace_period: 0s
    healthcheck:
      # Added check for MirrorName attribute to ensure that temporal-admin-tools service is ready
      # https://github.com/PeerDB-io/peerdb/blob/248fbe54d6b56b57d7908bdcc8cd0893d7f270f2/scripts/mirror-name-search.sh
      test: ["CMD-SHELL", "temporal workflow list && temporal operator search-attribute list | grep -w MirrorName"]
      interval: 1s
      timeout: 5s
      retries: 30

  temporal-ui:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: temporal-ui
    stop_grace_period: 0s

  flow-api:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: flow-api
    stop_grace_period: 0s

  flow-snapshot-worker:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: flow-snapshot-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 0s

  flow-worker:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: flow-worker
    stop_grace_period: 0s

  peerdb:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: peerdb
    stop_grace_period: 0s

  peerdb-ui:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: peerdb-ui
    stop_grace_period: 0s

  minio:
    extends:
      file: ./data/peerdb/docker-compose.yml
      service: minio
    stop_grace_period: 0s

volumes:
  pgdata:
  minio-data:
