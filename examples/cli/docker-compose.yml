name: dw-lib-example

services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      PGDATA: /var/lib/postgresql/data # For compatibility with Postgres before and after v18
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example
      TZ: UTC
    ports:
      - 25432:5432
    volumes:
      - ./infra/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data:rw
    command: postgres -c wal_level=logical -c max_wal_senders=2 -c max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.24.21-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DB: example
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 28123:8123
    volumes:
      - clickhouse-data:/var/lib/clickhouse/:rw
      - clickhouse-logs:/var/log/clickhouse-server/:rw
    healthcheck:
      test: wget --no-verbose --spider http://0.0.0.0:8123/ping || exit 1
      interval: 1s
      timeout: 1s
      retries: 10

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.7.1
    ports:
      - 20428:10428
    volumes:
      - victoria-traces-data:/victoria-traces-data/:rw
    healthcheck:
      test: wget --no-verbose --spider http://0.0.0.0:10428 || exit 1
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  catalog:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: catalog
    stop_grace_period: 0s

  temporal-setup-postgres:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-setup-postgres
    stop_grace_period: 0s

  temporal-server:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-server
    stop_grace_period: 0s

  temporal-create-namespace:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-create-namespace
    stop_grace_period: 0s

  temporal-ui:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: temporal-ui
    stop_grace_period: 0s

  peerdb-flow-api:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-flow-api
    stop_grace_period: 0s

  peerdb-flow-snapshot-worker:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-flow-snapshot-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 0s

  peerdb-flow-worker:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-flow-worker
    stop_grace_period: 0s

  peerdb-server:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-server
    stop_grace_period: 0s

  peerdb-ui:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: peerdb-ui
    stop_grace_period: 0s

  minio:
    extends:
      file: ../../vendor/peerdb/docker-compose.yml
      service: minio
    stop_grace_period: 0s

volumes:
  catalog-data:
  minio-data:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  victoria-traces-data:
