services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 25432:5432
    command: postgres -c wal_level=logical -c max_wal_senders=2 -c max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

  garage:
    container_name: garage
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.4.1}
    volumes:
      - garage-data:/var/lib/garage
      - ../infra/peerdb/garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      - GARAGE_ADMIN_TOKEN=garage-dev-admin-token-0123456789abcdef
      - GARAGE_DEFAULT_ACCESS_KEY=garageadmin
      - GARAGE_DEFAULT_SECRET_KEY=garagepassword1234
      - GARAGE_DEFAULT_BUCKET=loader
    ports:
      - 28950:3900
      - 28951:3903
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 30s
    stop_grace_period: 0s

volumes:
  garage-data:
