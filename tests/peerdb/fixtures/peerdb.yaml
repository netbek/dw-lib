api_url: http://localhost:3000/api

settings:
  PEERDB_NULLABLE: "true"

peers:
  source:
    type: postgres
    settings:
      host: postgres
      port: 5432
      username: postgres
      password: postgres
      database: test

  destination:
    type: clickhouse
    settings:
      host: clickhouse
      http_port: 8123
      tcp_port: 9000
      username: default
      password: default
      database: default
      secure: false

mirrors:
  +do_initial_snapshot: false
  +resync: false

  cdc_small:
    source_name: source
    destination_name: destination
    table_mappings:
    - source_table_identifier: public.table_1
      destination_table_identifier: table_1
    resync: true

  cdc_large:
    source_name: source
    destination_name: destination
    table_mappings:
    - source_table_identifier: public.table_2
      destination_table_identifier: table_2
    - source_table_identifier: public.table_3
      destination_table_identifier: table_3

publications:
  publication_1:
  - private.table_1
  - private.table_2
  publication_2:
  - private.table_3
