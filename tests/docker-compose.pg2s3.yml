services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test
      - TZ=UTC
    ports:
      - 25432:5432
    command: postgres -c wal_level=logical -c max_wal_senders=2 -c max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 10
    stop_grace_period: 0s

