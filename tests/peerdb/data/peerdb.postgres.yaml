api_url: http://localhost:3000/api

settings:
  PEERDB_NULLABLE: "true"

peers:
  source:
    type: postgres
    settings:
      host: host.docker.internal
      port: 25432
      username: postgres
      password: postgres
      database: test
    adapter_settings:
      host: localhost
      port: 25432
      username: postgres
      password: postgres
      database: test

  destination:
    type: postgres
    settings:
      host: host.docker.internal
      port: 25432
      username: postgres
      password: postgres
      database: test
    adapter_settings:
      host: localhost
      port: 25432
      username: postgres
      password: postgres
      database: test

mirrors:
  +do_initial_snapshot: false
  +resync: false

  cdc_one:
    source_name: source
    destination_name: destination
    table_mappings:
    - source_relation: public.table_1
      destination_relation: replica.table_1
    resync: true

  cdc_many:
    source_name: source
    destination_name: destination
    table_mappings:
    - source_relation: public.table_2
      destination_relation: replica.table_2
    - source_relation: public.table_3
      destination_relation: replica.table_3

